spring.application.name=talentsphere

server.port=${PORT:8080}
server.error.include-message=always

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/recruitdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-32-chars-long}
app.jwt.expiry-ms=86400000

# OpenAI-compatible endpoint (Groq default). Works with OpenAI / Gemini-compat too.
app.ai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:llama-3.3-70b-versatile}

# NEW: Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
