spring.application.name=talentsphere

server.error.include-message=always
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/recruitdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:16041604}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-32-chars-long}
app.jwt.expiry-ms=86400000

# AI Service Configuration
# Default: OpenAI-compatible endpoint (Groq / OpenAI / Gemini).
# Get a free Groq API key at https://console.groq.com/keys (starts with gsk_...)
# If no API key is provided, TalentSphere automatically uses the built-in semantic analysis engine.
app.ai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:llama-3.3-70b-versatile}
